<div *ngIf="fetchSuccessful" class="detailpage">
    <div class="top-row">    
        <h1>{{user.name}}</h1>     
        <sdx-button-group>
            <sdx-button label="Edit"></sdx-button>
            <sdx-button theme="secondary" label="Delete" (click)="deleteUser(user.id);" ></sdx-button>
        </sdx-button-group>    
    </div>
    <h4>{{user.description}}</h4>


    <div class="details">
        <div class="row">
            <p class="col-xs"><sdx-icon class="icon" icon-name="icon-account" size="" sr-hint="Displays the user account"></sdx-icon> E-Mail: {{user.email}}</p>
            <p class="col-xs">UID: {{user.uid}}</p>
            <p class="col-xs"></p>
        </div>
        <div class="row">
            <p class="col-xs"><sdx-icon class="icon" icon-name="icon-speech-bubble" size="" sr-hint="Displays the user account"></sdx-icon> Comment: {{user.comment}}</p>
            <p class="col-xs">GID: {{user.gid}}</p>
            <p class="col-xs"></p>
        </div>
    </div>
    <hr class="divider divider--mid-gray" aria-hidden="true">

</div>

<div *ngIf="!fetchSuccessful" class="error">
        <app-error-page [type]="'fetchError'"></app-error-page>
</div>
